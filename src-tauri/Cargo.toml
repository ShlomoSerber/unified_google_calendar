[package]
name = "unified-google-calendar"
version = "0.1.0"
description = "All your Google accounts in one calendar"
authors = ["Shlomo Serber"]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "unified_google_calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# Stack per docs/02-arquitectura.md section 1. Versions pinned to the minor line in use.
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-opener = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower = { version = "0.5", features = ["util"] }
rrule = "0.13"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
notify-rust = { version = "4.11", default-features = false, features = ["z"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
sha1 = "0.10"
zbus = { version = "5", default-features = false, features = ["tokio"] }
uuid = { version = "1.26", features = ["v4"] }
rand = "0.9"
base64 = "0.22"
url = "2.5"
subtle = "2.6"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3.27"
http-body-util = "0.1"

[features]
# Never enable devtools in release (docs/02 section 6).
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[workspace]

[workspace.lints.clippy]
all = "warn"

[lints]
workspace = true
